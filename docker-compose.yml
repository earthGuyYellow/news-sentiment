x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required in .env}'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__LOGGING_LEVEL: INFO
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    # Credentials & Database Configuration for Pipeline
    NEWSAPI_KEY: '${NEWSAPI_KEY:?NEWSAPI_KEY is required in .env}'
    WAREHOUSE_DB_HOST: postgres
    WAREHOUSE_DB_PORT: 5432
    WAREHOUSE_DB_NAME: news_warehouse
    WAREHOUSE_DB_USER: ${POSTGRES_USER:-airflow}
    WAREHOUSE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins:ro
    - ./dbt_stem:/opt/airflow/dbt_stem
    - ./scripts:/opt/airflow/scripts:ro
  user: "${AIRFLOW_UID:-50000}:0"
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - pipeline_net

services:
  # ============================================================================
  # Shared PostgreSQL Container (Airflow Metadata + STEM Data Warehouse)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: news_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_MULTIPLE_DATABASES: news_warehouse
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    # Bound strictly to localhost so external network devices cannot reach the DB
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airflow} -d $${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pipeline_net

  # ============================================================================
  # Airflow Database Initialization Service (One-Time Execution)
  # ============================================================================
  airflow-init:
    <<: *airflow-common
    container_name: stem_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Migrating Airflow database..."
        airflow db migrate
        echo "Creating admin user..."
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
        echo "Initialization complete."
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?AIRFLOW_ADMIN_USER is required in .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required in .env}

  # ============================================================================
  # Airflow Webserver (UI at http://localhost:8080)
  # ============================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: news_airflow_webserver
    command: webserver
    # Bound to 127.0.0.1; change to 0.0.0.0 only if accessing from another LAN client
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================================================
  # Airflow Scheduler (Runs Ingestion DAGs and dbt Transformations)
  # ============================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: stem_airflow_scheduler
    command: scheduler
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:

networks:
  pipeline_net:
    driver: bridge
